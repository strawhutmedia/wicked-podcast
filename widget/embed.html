<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram Feed - Straw Hut Media</title>
  <link rel="stylesheet" href="widget.css">
</head>
<body>
  <div id="shm-instagram-widget" class="shm-instagram-feed">
    <div class="shm-loading">
      <div class="shm-spinner"></div>
      <p>Loading Instagram feed...</p>
    </div>
  </div>
  <script src="widget.js"></script>
  <script>
    // Auto-initialize when embedded
    document.addEventListener('DOMContentLoaded', function() {
      SHMInstagramWidget.init({
        container: '#shm-instagram-widget',
        // API URL will be relative when embedded on same domain
        apiUrl: window.SHM_WIDGET_API_URL || '/api/posts'
      });
    });
  </script>
</body>
</html>
